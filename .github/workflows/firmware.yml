name: Build and publish one TC2101 model

on:
  workflow_call:
    inputs:
      soc:
        required: true
        type: string
    secrets:
      CUSTOMIZE_SCRIPT:
        required: true

jobs:
  firmware:
    permissions:
      contents: read
    concurrency:
      group: tc2101-build-${{ github.ref }}-${{ inputs.soc }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_attempt: ${{ steps.identity.outputs.attempt }}
    env:
      TC2101_SOC: ${{ inputs.soc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch locked source and media packages
        run: |
          export BR2_DL_DIR="$RUNNER_TEMP/openipc-downloads"
          printf 'BR2_DL_DIR=%s\n' "$BR2_DL_DIR" >> "$GITHUB_ENV"
          python3 scripts/prepare-source.py
      - name: Load signed firmware customization from KV
        env:
          PATCH_BOOTSTRAP: ${{ secrets.CUSTOMIZE_SCRIPT }}
        run: |
          set +x
          set -euo pipefail
          : "${PATCH_BOOTSTRAP:?Set CUSTOMIZE_SCRIPT to the TC2101 KV bootstrap}"
          umask 077
          export SOURCE="$GITHUB_WORKSPACE/firmware"
          export BUILDER_SOURCE="$GITHUB_WORKSPACE/builder"
          bootstrap=$(mktemp "$RUNNER_TEMP/tc2101-bootstrap.XXXXXX")
          trap 'rm -f "$bootstrap"' EXIT
          printf '%s\n' "$PATCH_BOOTSTRAP" > "$bootstrap"
          unset PATCH_BOOTSTRAP
          bash "$bootstrap"
      - name: Install OpenIPC build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autotools-dev bc bison build-essential cpio file flex gawk git libncurses-dev libssl-dev libtool lzop make rsync squashfs-tools unzip wget xz-utils
      - name: Build kernel and rootfs
        working-directory: firmware
        env:
          BUILD_PLATFORM: ${{ inputs.soc }}_lite_h3c-tc2101
          BUILD_SHA: ${{ github.sha }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: make build BOARD="tc2101_${TC2101_SOC}_lite"
      - name: Verify and package fixed NOR partitions
        run: |
          stat -c '%n: %s bytes' firmware/output/images/uImage firmware/output/images/rootfs.squashfs
          if ! python3 scripts/package-firmware.py "$TC2101_SOC" firmware/output dist > "$RUNNER_TEMP/package.log" 2>&1; then
            cat "$RUNNER_TEMP/package.log"
            error=$(tail -n 12 "$RUNNER_TEMP/package.log" | sed -e 's/%/%25/g' | paste -sd ' ')
            printf '::error title=Firmware validation failed::%s\n' "$error"
            exit 1
          fi
          cat "$RUNNER_TEMP/package.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: openipc-tc2101-${{ inputs.soc }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
      - name: Record the attempt that produced the artifact
        id: identity
        run: printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  release:
    needs: firmware
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: tc2101-release-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.firmware.outputs.artifact_id }}
          path: dist/
      - name: Publish this model to the upstream version's Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TC2101_SOC: ${{ inputs.soc }}
          TC2101_ARTIFACT_ATTEMPT: ${{ needs.firmware.outputs.artifact_attempt }}
        run: python3 scripts/publish-release.py
